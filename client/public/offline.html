<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1111" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Offline · Hotspot</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #f4efe9;
        background:
          radial-gradient(56rem 32rem at 85% -10%, rgba(196, 38, 38, 0.36), transparent 62%),
          linear-gradient(180deg, #1a1111, #130c0c 40%);
        -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; max-width: 360px; text-align: center; }
      img { height: 56px; width: auto; }
      h1 { font-size: 22px; margin: 28px 0 8px; letter-spacing: -0.01em; }
      p { margin: 0; font-size: 15px; line-height: 1.5; color: rgba(244, 239, 233, 0.7); }
      button {
        margin-top: 28px;
        width: 100%;
        height: 52px;
        border: 0;
        border-radius: 14px;
        background: #c62a2a;
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
      .hint { margin-top: 14px; font-size: 13px; color: rgba(244, 239, 233, 0.5); }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/hotspot-logo.png" alt="Hotspot Market" />
      <h1>You're offline</h1>
      <p>Payroll, punches and schedules need an internet connection. Check your Wi-Fi or signal and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="hint">This screen reloads on its own when you're back online.</p>
    </main>
    <script>
      // Come back as soon as the connection does. The "online" event isn't
      // reliable on every phone, so also check quietly every few seconds and
      // whenever the app returns to the foreground.
      var reloading = false;
      function retry() {
        if (reloading) return;
        fetch("/manifest.webmanifest", { cache: "no-store" })
          .then(function (res) {
            if (res.ok && !reloading) {
              reloading = true;
              location.reload();
            }
          })
          .catch(function () {});
      }
      window.addEventListener("online", retry);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") retry();
      });
      setInterval(retry, 5000);
    </script>
  </body>
</html>
